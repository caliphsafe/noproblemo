<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
 <defs>
  <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
   <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="7" result="n"/>
   <feDisplacementMap in="SourceGraphic" in2="n" scale="0.7"/>
  </filter>
  <filter id="dust" x="-20%" y="-20%" width="140%" height="140%">
   <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="2" seed="13" result="noise"/>
   <feComposite in="SourceGraphic" in2="noise" operator="in"/>
  </filter>
 </defs>
 <rect x="2" y="2" width="44" height="44" rx="0.5" fill="none" stroke="#f5f1df" stroke-opacity=".68" stroke-width="2.2" filter="url(#rough)"/>
 <rect x="2.4" y="2.1" width="43.3" height="43.7" fill="none" stroke="#f5f1df" stroke-opacity=".22" stroke-width="1.1" stroke-dasharray="5 2 9 1.5" filter="url(#dust)"/>
</svg>
